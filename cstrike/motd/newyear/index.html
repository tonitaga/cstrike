<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Новогодний кейс INCOMSYSTEM</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{background:#101820;color:#f6eee1;font-family:Arial,sans-serif;overflow:hidden}
.scene{position:absolute;top:0;right:0;bottom:0;left:0;padding:16px;background:#182a33;background:radial-gradient(ellipse at 50% 65%,#27454a 0,#182a33 42%,#111922 80%)}
h1{position:relative;margin:0;text-align:center;font-size:18px;letter-spacing:2px;color:#f2d29a}
.panel{position:absolute;top:50%;left:0;right:0;margin-top:-69px;text-align:center}
.intro{padding-top:18px}
.box{position:relative;width:174px;height:105px;margin:0 auto 24px;perspective:450px}
.crate,.lid{position:absolute;left:0;width:174px;border:2px solid #f0b866;border-radius:4px;background:#9c3b40;background:linear-gradient(90deg,#8c2932 0%,#a84543 43%,#f6cb76 44%,#ba833f 56%,#a84543 57%,#78232c 100%)}
.crate{bottom:0;height:67px;box-shadow:inset 0 7px 8px #681f27,0 12px 26px rgba(0,0,0,.55)}
.crate:before,.lid:before{content:"";position:absolute;top:0;bottom:0;left:43%;width:14%;background:#bf8c48}
.crate:after{content:"❄";position:absolute;right:13px;bottom:11px;color:#f6d394;font-size:25px}
.lid{top:16px;height:32px;transform-origin:center top;box-shadow:0 5px 9px rgba(0,0,0,.55)}
.glow{position:absolute;top:22px;left:22px;width:130px;height:65px;background:#f8d69c;opacity:0;filter:blur(12px);border-radius:50%}
.copy{font-size:13px;color:#e6d2b3}
.hidden{display:none!important}
#roulette{top:48px;top:calc(48px + 4%);right:12px;bottom:12px;bottom:calc(12px + 4%);left:12px;margin:0;overflow:hidden}
.roller{position:absolute;left:0;right:0;overflow:hidden;background:#13232c;border-radius:5px}
.rail{position:absolute;left:0}
.roller:before,.roller:after{content:"";position:absolute;top:0;bottom:0;width:5%;z-index:2;pointer-events:none}
.roller:before{left:0;background:linear-gradient(to right,#18262d,transparent)}
.roller:after{right:0;background:linear-gradient(to left,#18262d,transparent)}
.card{display:inline-block;vertical-align:top;width:124px;height:119px;margin-right:7px;padding:5px 5px 7px;background:#172631;border:1px solid #657382;border-bottom-width:3px;border-radius:4px;white-space:normal;text-align:center}
.card img{display:block;width:100%;height:auto;border-radius:2px;background:#30353e}
.card strong,.card span{display:block;font-size:11px;line-height:1.2;margin-top:3px}
.card span{color:#ccd3dc}
.common{border-color:#9caaba;color:#d7e0e9}
.rare{border-color:#479af1;color:#75baff}
.epic{border-color:#b66ce8;color:#d697fc}
.legendary{border-color:#f4ba57;color:#ffd17c}
.marker{position:absolute;z-index:3;top:1px;bottom:1px;left:50%;width:2px;margin-left:-1px;background:#ffc875;box-shadow:0 0 8px #ffc875;pointer-events:none}
.marker:before{position:absolute;top:-1px;left:-5px;content:"";border-top:8px solid #ffc875;border-right:6px solid transparent;border-left:6px solid transparent}
.knife-mystery{box-shadow:inset 0 0 0 1px currentColor;border-width:2px}
#roulette .knife-mystery img{object-fit:contain;background:transparent}
.selected{box-shadow:inset 0 0 0 1px currentColor,0 0 7px currentColor}
.result-card{display:block;margin:0 auto;width:240px;height:auto;padding:7px 7px 9px}
.result-card strong{font-size:16px}.result-card span{font-size:13px}
.balance{margin-top:9px;color:#d9d3cb;font-size:12px}
.sale{margin-top:6px;color:#ffd37f;font-weight:bold;font-size:13px}
@media(max-height:310px){.scene{padding:9px}.panel{top:55%}.result-card{width:180px}.box{margin-bottom:8px}}
#roulette .card{position:absolute;top:0;margin:0;overflow:hidden}
#roulette .card img{margin:0 auto}
#roulette .compact .card{text-align:left}
#roulette .compact .card img{float:left;margin:0 6px 0 0}
#result{top:0;bottom:0;margin:0;padding:0 12px;overflow:auto}
.result-layout{display:table;width:100%;height:100%}
#result-content{display:table-cell;vertical-align:middle}
.batch-result .result-card{display:inline-block;vertical-align:top;width:126px;margin:3px}
.batch-result .result-card strong,.batch-result .result-card span,.batch-result .sale{font-size:10px}
.batch-result .result-card img{height:48px;object-fit:contain}
@media(max-height:310px){#roulette{top:34px;right:5px;bottom:5px;left:5px}#result{padding:0 5px}.batch-result .result-card{width:30%;min-width:96px;min-height:50px;padding:4px}.batch-result .result-card img{float:left;width:38%;height:30px;margin-right:4px}.batch-result .sale{margin-top:3px}}
</style>
</head>
<body>
<div class="scene">
<h1>НОВОГОДНИЙ КЕЙС</h1>
<div class="panel intro" id="intro">
    <div class="box">
        <div class="glow"></div><div class="crate"></div><div class="lid"></div>
    </div>
    <div class="copy">Открываем кейс…</div>
</div>
<div class="panel hidden" id="roulette"></div>
<div class="panel hidden" id="result" aria-live="polite">
    <div class="result-layout"><div id="result-content"></div></div>
</div>
<div class="panel hidden" id="saved">
    <div class="copy">Результаты отправлены в игровой чат</div>
    <div class="balance">Можно закрыть окно и вернуться в игру.</div>
</div>
<noscript><p>Для графической рулетки нужен JavaScript. Закройте окно и откройте /wintercollection.</p></noscript>
</div>
<script src="catalog.js?v=14"></script>
<script src="reveal.js?v=19"></script>
</body>
</html>
