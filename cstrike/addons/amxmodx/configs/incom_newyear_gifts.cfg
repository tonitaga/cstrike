// Новогоднее событие. Настройки загружаются при смене карты.
// Вероятности допускают дробные значения с точкой, например 2.5.

// ===== Событие и появление подарков =====
// 1 включает событие, 0 отключает его.
incom_newyear_gifts_enabled "1"
// Минимум живых или мёртвых людей в командах T/CT. 0 отключает проверку.
incom_newyear_gifts_min_players "4"
// Интервал между попытками спавна, в секундах.
incom_newyear_gifts_interval "60"
// Минимум подарков за волну при наличии свободных точек.
incom_newyear_gifts_wave_min "2"
// Максимум за волну. Предел плагина — 24.
incom_newyear_gifts_wave_max "5"
// Сколько подарков может одновременно лежать на карте. Предел — 24.
incom_newyear_gifts_active_max "10"
// Через сколько секунд неподобранный подарок исчезнет.
incom_newyear_gifts_lifetime "55"

// ===== Награда за обычный и редкий подарок =====
// Минимум снежинок за коробку до множителя.
incom_newyear_gifts_reward_min "15"
// Максимум снежинок за коробку до множителя.
incom_newyear_gifts_reward_max "21"
// Шанс редкой коробки в процентах (0–100). Остаток — шанс обычной.
incom_newyear_gifts_rare_chance "5"
// Множитель снежинок за редкую коробку. Минимум 1.0, дробные допустимы.
incom_newyear_gifts_rare_multiplier "2.0"
// Независимый шанс кейса в процентах (0–100) за любую коробку, сверх снежинок.
// Кейс равновероятно выбирается среди доступных типов события, для которых есть место в хранилище.
incom_newyear_gifts_case_chance "5"

// ===== Снежинки за убийства =====
// Снежинки за убийство игрока из другой команды.
incom_newyear_gifts_kill_reward "2"
// Пауза между наградами за убийство одного и того же игрока, в секундах.
incom_newyear_gifts_kill_cooldown "20"

// ===== Кейсы и рулетка =====
// Цена покупки одного кейса в снежинках.
incom_newyear_gifts_case_price "60"
// Пусто — взять адрес рулетки из FastDL. off — выводить результат в чат.
incom_newyear_gifts_case_motd_url ""
